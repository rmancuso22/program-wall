<title>Compute Workloads Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --ground:#f4f4f4; --surface:#ffffff; --surface-2:#f4f4f4; --surface-3:#e8e8e8;
    --line:#e0e0e0; --line-strong:#8d8d8d;
    --text:#161616; --text-2:#525252; --text-3:#6f6f6f;
    --shell:#161616; --shell-line:#393939;
    --accent:#0f62fe; --accent-hover:#0353e9; --accent-soft:#edf5ff; --focus:#0f62fe;
    --flag-risk:#b28600; --flag-block:#da1e28; --ok:#198038;
    --track-empty:#dcdcdc; --grid:#e6e6e6; --dep:#8d8d8d;

    --p0:#6f6f6f;  /* requirements */
    --p1:#8a3ffc;  /* design */
    --p2:#0f62fe;  /* dev */
    --p3:#ff832b;  /* pipeline */
    --p4:#007d79;  /* test */
    --p5:#198038;  /* released */

    --st-effort-bg:#d0e2ff; --st-effort-line:#a6c8ff;
    --st-milestone-bg:#e8daff; --st-milestone-line:#d4bbff;

    --shadow:0 1px 0 rgba(22,22,22,.06), 0 2px 6px rgba(22,22,22,.06);
    --shadow-lift:0 2px 0 rgba(22,22,22,.10), 0 10px 24px rgba(22,22,22,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --ground:#161616; --surface:#262626; --surface-2:#333333; --surface-3:#393939;
      --line:#393939; --line-strong:#6f6f6f;
      --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#a8a8a8;
      --shell:#000000; --shell-line:#393939;
      --accent:#4589ff; --accent-hover:#6ea6ff; --accent-soft:#1b2a4a; --focus:#ffffff;
      --flag-risk:#f1c21b; --flag-block:#fa4d56; --ok:#42be65;
      --track-empty:#4a4a4a; --grid:#2c2c2c; --dep:#8d8d8d;
      --p0:#a8a8a8; --p1:#be95ff; --p2:#4589ff; --p3:#ff832b; --p4:#08bdba; --p5:#42be65;
      --st-effort-bg:#00308f; --st-effort-line:#0f62fe;
      --st-milestone-bg:#491d8b; --st-milestone-line:#8a3ffc;
      --shadow:0 1px 0 rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.35);
      --shadow-lift:0 2px 0 rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --ground:#161616; --surface:#262626; --surface-2:#333333; --surface-3:#393939;
    --line:#393939; --line-strong:#6f6f6f; --text:#f4f4f4; --text-2:#c6c6c6; --text-3:#a8a8a8;
    --shell:#000000; --shell-line:#393939; --accent:#4589ff; --accent-hover:#6ea6ff; --accent-soft:#1b2a4a; --focus:#ffffff;
    --flag-risk:#f1c21b; --flag-block:#fa4d56; --ok:#42be65; --track-empty:#4a4a4a; --grid:#2c2c2c; --dep:#8d8d8d;
    --p0:#a8a8a8; --p1:#be95ff; --p2:#4589ff; --p3:#ff832b; --p4:#08bdba; --p5:#42be65;
    --st-effort-bg:#00308f; --st-effort-line:#0f62fe; --st-milestone-bg:#491d8b; --st-milestone-line:#8a3ffc;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.35);
    --shadow-lift:0 2px 0 rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--text);
    font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.35;
    -webkit-font-smoothing:antialiased;overflow:hidden;position:relative;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .lbl{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
  .icon{width:16px;height:16px;fill:currentColor;flex:0 0 auto;display:block}
  .sp{flex:1 1 auto}

  /* ---------- views + transition ---------- */
  .view{
    position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;background:var(--ground);
    transition:transform .22s cubic-bezier(.2,0,0,1),opacity .18s linear;
  }
  .view.left{transform:translateX(-40px);opacity:0;pointer-events:none}
  .view.right{transform:translateX(40px);opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.view{transition:none}}

  /* ---------- shell ---------- */
  .shell{
    height:48px;flex:0 0 auto;background:var(--shell);color:#f4f4f4;display:flex;align-items:center;
    border-bottom:1px solid var(--shell-line);padding-right:8px;
  }
  .brand{display:flex;align-items:baseline;gap:8px;padding:0 16px}
  .brand b{font-weight:600}
  .brand span{color:#c6c6c6}
  .divider{width:1px;height:24px;background:var(--shell-line)}
  .scope{display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0}
  .scope .mono{font-size:12px;color:#8d8d8d;white-space:nowrap}
  .scope em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shell-btn{height:48px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:13px;color:#f4f4f4;white-space:nowrap}
  .shell-btn:hover{background:#353535}
  .shell-btn.pri{background:var(--accent)}
  .shell-btn.pri:hover{background:var(--accent-hover)}

  /* ---------- filter bar ---------- */
  .filters{
    flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);
    padding:10px 20px 12px;display:flex;flex-direction:column;gap:8px;
  }
  .frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .frow > .lbl{width:56px;flex:0 0 56px}
  .bubbles{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
  .bub{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-size:12px;white-space:nowrap;
    transition:background .1s linear,border-color .1s linear,color .1s linear;
  }
  .bub:hover{border-color:var(--line-strong);color:var(--text)}
  .bub .dot{width:7px;height:7px;border-radius:999px;flex:0 0 auto}
  .bub .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3)}
  .bub[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--ground)}
  .bub[aria-pressed="true"] .n{color:var(--ground);opacity:.7}
  .bub.q{font-family:"IBM Plex Mono",monospace;letter-spacing:.03em}
  @media (prefers-reduced-motion:reduce){.bub{transition:none}}

  .toolrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:2px}
  .search{
    flex:0 1 280px;min-width:180px;display:flex;align-items:center;gap:8px;
    background:var(--surface-2);border-bottom:1px solid var(--line-strong);height:32px;padding:0 10px;
  }
  .search svg{width:14px;height:14px;fill:var(--text-3);flex:0 0 auto}
  .search input{border:0;background:none;outline:none;width:100%;font-size:13px}
  .search input::placeholder{color:var(--text-3)}
  .count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-2);white-space:nowrap}
  .count b{color:var(--text);font-weight:600}
  .seg{display:flex;border:1px solid var(--line)}
  .seg button{
    height:32px;padding:0 12px;font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;
    color:var(--text-2);border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--text);color:var(--ground)}
  .linkbtn{font-size:12px;color:var(--accent);padding:6px 2px}
  .linkbtn:hover{text-decoration:underline}

  /* ---------- lanes ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;padding:0 20px 56px}
  .lane{padding-top:22px}
  .lane[hidden]{display:none!important}
  .lane-head{
    position:sticky;top:0;z-index:5;background:var(--ground);
    display:flex;align-items:baseline;gap:12px;padding:6px 0 10px;border-bottom:1px solid var(--line);
  }
  .lane-head .q{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;letter-spacing:.02em}
  .lane-head .sub{font-size:12px;color:var(--text-3)}
  .lane-head .tally{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--text-3)}
  .lane-head .bar{display:flex;height:4px;width:120px;background:var(--track-empty);overflow:hidden;align-self:center}
  .lane-head .bar i{display:block;height:100%}
  .lane.backlog .lane-head .q{color:var(--text-3)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:10px;padding-top:12px}
  body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:8px}

  /* ---------- roadmap card ---------- */
  .card{
    position:relative;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
    padding:11px 12px 10px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;
    transition:box-shadow .1s linear,border-color .1s linear;
  }
  .card::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:var(--pc)}
  .card:hover{box-shadow:var(--shadow-lift);border-color:var(--line-strong)}
  .card[aria-pressed="true"]{border-color:var(--text);box-shadow:var(--shadow-lift)}
  .card[hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){.card{transition:none}}
  .card .top{display:flex;align-items:center;gap:6px}
  .card .id{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--text-3)}
  .card .qtag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.05em;color:var(--text-3);border:1px solid var(--line);padding:0 5px;line-height:15px}
  .flag{margin-left:auto;display:flex;align-items:center;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase}
  .flag svg{width:11px;height:11px}
  .f-risk{color:var(--flag-risk)} .f-block{color:var(--flag-block)}
  .card .name{font-size:13.5px;font-weight:600;line-height:1.3;letter-spacing:-.005em}
  .teams{display:flex;gap:4px;flex-wrap:wrap}
  .tag{
    display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;
    background:var(--surface-2);color:var(--text-2);border:1px solid var(--line);white-space:nowrap;
  }
  .card .phase{display:flex;align-items:center;gap:8px;margin-top:auto}
  .track{display:flex;gap:2px;flex:0 0 auto}
  .track i{width:13px;height:4px;background:var(--track-empty);display:block}
  .track i.on{background:var(--pc)}
  .pname{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
  body[data-density="compact"] .card{gap:6px;padding:9px 10px 8px}
  body[data-density="compact"] .card .teams{display:none}
  body[data-density="compact"] .card .name{font-size:12.5px}
  body[data-density="compact"] .track i{width:10px}
  .empty{padding:48px 0 12px;text-align:center;color:var(--text-3);font-size:13px}
  .empty b{display:block;color:var(--text);font-size:15px;font-weight:600;margin-bottom:6px}

  /* ---------- detail panel ---------- */
  .panel{
    position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);
    border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.18);z-index:40;display:flex;flex-direction:column;
  }
  .panel[hidden]{display:none!important}
  .panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .panel-head .x{width:28px;height:28px;display:grid;place-items:center;color:var(--text-3);flex:0 0 auto;margin-left:auto}
  .panel-head .x:hover{background:var(--surface-2);color:var(--text)}
  .panel-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;flex:1 1 auto}
  .panel-foot{padding:12px 16px 16px;border-top:1px solid var(--line)}
  .pblock{display:flex;flex-direction:column;gap:7px}
  .steps{display:flex;flex-direction:column;gap:1px}
  .step{display:flex;align-items:center;gap:10px;padding:7px 9px;background:var(--surface-2);font-size:12px}
  .step .pip{width:8px;height:8px;border-radius:999px;background:var(--track-empty);flex:0 0 auto}
  .step.done .pip{background:var(--pc)}
  .step.now{background:var(--accent-soft);font-weight:600}
  .step .when{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3)}
  .btn{
    height:40px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:24px;
    font-size:14px;width:100%;
  }
  .btn.pri{background:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent-hover)}
  .btn.sec{border:1px solid var(--text);color:var(--text)}
  .btn.sec:hover{background:var(--surface-2)}
  .note{font-size:12px;color:var(--text-3);line-height:1.45;margin:0}

  /* status / people / dates */
  .callout{
    background:var(--surface-2);border-left:3px solid var(--pc);padding:10px 12px;
    font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:6px;
  }
  .callout .stamp{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3);letter-spacing:.04em}
  .callout.risk{border-left-color:var(--flag-risk)}
  .callout.block{border-left-color:var(--flag-block)}
  .desc{font-size:12.5px;line-height:1.5;color:var(--text-2);margin:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px}
  .kv > div{display:contents}
  .kv .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:7px 0;border-bottom:1px solid var(--line);white-space:nowrap;display:flex;align-items:center}
  .kv .v{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-width:0}
  .kv > div:last-child .k,.kv > div:last-child .v{border-bottom:0}
  .kv .av{width:20px;height:20px;font-size:8px;flex:0 0 auto}
  .kv .pn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .contact{display:flex;gap:2px;flex:0 0 auto;margin-left:auto}
  .cbtn{
    width:26px;height:26px;display:grid;place-items:center;color:var(--text-3);
    text-decoration:none;border:0;background:none;cursor:pointer;
  }
  .cbtn svg{width:15px;height:15px;fill:currentColor}
  .cbtn:hover{background:var(--surface-2);color:var(--accent)}
  /* RAG status light */
  .rag{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
  .rag i{width:9px;height:9px;border-radius:999px;flex:0 0 auto;box-shadow:0 0 0 2px var(--surface)}
  .rag.green i{background:var(--ok)} .rag.yellow i{background:var(--flag-risk)} .rag.red i{background:var(--flag-block)}
  .rag.green{color:var(--ok)} .rag.yellow{color:var(--flag-risk)} .rag.red{color:var(--flag-block)}
  .card .rag{margin-left:auto}
  .callout.green{border-left-color:var(--ok)} .callout.yellow{border-left-color:var(--flag-risk)} .callout.red{border-left-color:var(--flag-block)}
  .ragseg{display:flex;border:1px solid var(--line)}
  .ragseg button{flex:1 1 0;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);border-right:1px solid var(--line)}
  .ragseg button:last-child{border-right:0}
  .ragseg button i{width:9px;height:9px;border-radius:999px}
  .ragseg button[aria-pressed="true"]{background:var(--text);color:var(--ground)}
  .risks{display:flex;flex-direction:column;gap:1px}
  .risk{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;background:var(--surface-2);font-size:12.5px;line-height:1.4}
  .risk svg{width:13px;height:13px;fill:var(--flag-risk);flex:0 0 auto;margin-top:2px}
  .risk.none{color:var(--text-3)}
  .risk.none svg{fill:var(--ok)}
  .frow.dual{gap:18px}
  .frow.dual .grp{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
  .frow.dual .grp .bubbles{flex:0 1 auto}
  /* ---------- design tab ---------- */
  .rdoc{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface)}
  .rdoc + .rdoc{margin-top:22px}
  .doc-head{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .doc-head .ttl{font-size:16px;font-weight:600;line-height:1.25}
  .doc-head .sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--text-3)}
  .gh{
    display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--accent);
    text-decoration:none;padding:3px 8px;border:1px solid var(--line);background:var(--surface-2);
  }
  .gh:hover{border-color:var(--accent)}
  .gh svg{width:13px;height:13px;fill:currentColor}
  .dstate{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line)}
  .dstate i{width:8px;height:8px;border-radius:999px}
  .dstate.merged{color:var(--ok);border-color:var(--ok)} .dstate.merged i{background:var(--ok)}
  .dstate.approved{color:var(--ok);border-color:var(--ok)} .dstate.approved i{background:var(--ok)}
  .dstate.review{color:var(--accent);border-color:var(--accent)} .dstate.review i{background:var(--accent)}
  .dstate.changes{color:var(--p1);border-color:var(--p1)} .dstate.changes i{background:var(--p1)}
  .dstate.draft{color:var(--text-3)} .dstate.draft i{background:var(--text-3)}
  .stuck{
    display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;
    background:color-mix(in srgb, var(--flag-risk) 12%, var(--surface));
  }
  .stuck.red{background:color-mix(in srgb, var(--flag-block) 10%, var(--surface))}
  .stuck.ok{background:color-mix(in srgb, var(--ok) 10%, var(--surface))}
  .stuck svg{width:15px;height:15px;flex:0 0 auto}
  .stuck b{font-weight:600}
  .stuck .nudge{margin-left:auto;height:28px;padding:0 12px;border:1px solid var(--text);font-size:12px;display:flex;align-items:center;gap:6px}
  .stuck .nudge:hover{background:var(--surface-2)}
  .dmetrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .dmetrics .tile{padding:12px 18px}
  .dmetrics .v{font-size:20px}
  .dmetrics .v.hot{color:var(--flag-block)}
  .dsec{padding:16px 18px;border-bottom:1px solid var(--line)}
  .dsec:last-child{border-bottom:0}
  .dsec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .dsec-head h3{margin:0;font-size:13px;font-weight:600}
  .dsec-head .sub{font-size:12px;color:var(--text-3)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:11px;color:var(--text-2)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:10px;height:6px;border-radius:2px}

  /* reviewer queue timeline */
  .rq{display:grid;grid-template-columns:200px 1fr;gap:0;position:relative;padding-right:56px}
  .rq .axis{grid-column:2;position:relative;height:22px;border-bottom:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--text-3)}
  .rq .axis span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
  .rq .axis .tick{position:absolute;top:18px;width:1px;height:4px;background:var(--line-strong)}
  .rq .who{padding:9px 12px 9px 0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);min-width:0}
  .rq .who b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rq .who span{font-size:10.5px;color:var(--text-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;text-transform:uppercase}

  function sortCmp(a, b){
    var byNum = a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    if(state.sort === "phase") return (a.phase - b.phase) || (RAG_RANK[ragOf(a)] - RAG_RANK[ragOf(b)]) || byNum;
    if(state.sort === "health") return (RAG_RANK[ragOf(a)] - RAG_RANK[ragOf(b)]) || (a.phase - b.phase) || byNum;
    return byNum;
  }
  function applySort(){

  function anyFilter(){
    var on = function(o){ return Object.keys(o).some(function(k){ return o[k]; }); };

  function matches(p){
    var on = function(o){ return Object.keys(o).filter(function(k){ return o[k]; }); };
    if(on(state.rag).length && !state.rag[ragOf(p)]) return false;
    if(on(state.q).length && !state.q[QUARTERS[p.q].id]) return false;
    if(on(state.teams).length && !p.teams.some(function(t){ return state.teams[t]; })) return false;
    if(on(state.phases).length && !state.phases[PHASES[p.phase].key]) return false;
    if(state.query){
      var q = state.query.toLowerCase();
      if(p.name.toLowerCase().indexOf(q) === -1 && p.id.toLowerCase().indexOf(q) === -1) return false;

             '<span class="n">'+it.n+'</span></button>';
    }).join("");
    $(containerId).querySelectorAll("[data-"+attr+"]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = this.dataset[attr];

  function laneModel(p){

    var cards = [], links = [];
    var phaseDone = function(step){ return step < p.phase ? "done" : (step === p.phase ? (p.flag==="block"?"blocked":p.flag==="risk"?"atrisk":"ontrack") : "notstarted"); };

  function srbProse(p, rec, doc){

      sec("motivation","Motivation",0,'<p>The current approach relies on manual steps owned by '+esc(t1)+' that do not scale past the 4Q26 fleet size and leave no audit trail. Three of the last four incidents in this area traced back to drift between what was provisioned and what was recorded.</p><ul><li>Removes a runbook-driven process with a 2 to 3 day lead time.</li><li>Gives '+esc(t2)+' a single control point instead of per-region scripts.</li><li>Unblocks the '+q+' commitments that depend on it.</li></ul>')+
      sec("design","Proposed design",c.design,'<p>Two components. A control-plane service owned by '+esc(t1)+' holds desired state and exposes the API. A node agent owned by '+esc(t2)+' reconciles actual state against it and reports drift.</p><ul><li><strong>Control plane.</strong> Stateless service behind the fleet gateway, Postgres for desired state, event log for every transition.</li><li><strong>Agent.</strong> Runs on every node in scope, pulls desired state every 30s, applies changes idempotently, pushes status.</li><li><strong>Reconciliation.</strong> Agent reports are compared against desired state; drift beyond a threshold raises an alert and, where safe, is corrected automatically.</li></ul><p>Desired state is versioned. A change is a new version, never an edit, so any node can be explained by the version it last applied.</p>')+
      sec("api","API changes",0,'<p>New <code>/v3</code> resources for desired state and node status. No changes to existing <code>/v2</code> endpoints; they remain until the deprecation window closes in 2Q27. Full surface in the API spec PR.</p>')+
      sec("security","Security considerations",c.security,'<ul><li>Agent identity is the node\'s attested identity; no shared credentials.</li><li>Control-plane writes require the <code>fleet.write</code> scope; reads are scoped to the caller\'s pools.</li><li>Every transition is signed and appended to the event log, retained for 13 months.</li><li>Secrets never appear in desired state; references only, resolved by the agent at apply time.</li></ul>')+

        '<div class="prose">'+(kind === "srb" ? srbProse(p, rec, doc) : apiProse(p, rec, doc)).replace(/id="([a-z]+)"/g, 'id="'+prefix+'$1"')+'</div></div></div>'+

  /* ---------- mural: per-project sticky wall. Teams as rows, columns as work areas, cells pack stickies. ---------- */

    [7,2,"Ring 0 shadow-mode test plan","green"],[7,1,"Failure injection: agent offline 10 min","green"],[7,0,"API contract tests","green"]

  var MU = {};
  function muralKey(id){ return "cwr.mural3."+id; }
  function muralOf(p){
    if(MU[p.id]) return MU[p.id];

    try{ m = JSON.parse(localStorage.getItem(muralKey(p.id)) || "null"); }catch(e){}
    if(!m){
      var h = hash(p.id+"m"), rec = record(p);
      m = { lanes: MU_DEFAULT_LANES.slice(), cols: MU_DEFAULT_COLS.slice(), cards:[], links:[], seq:1, jseq:9 };
      var people = [rec.people.devlead, rec.people.arch, rec.people.pm, ""];
      MU_SEED.forEach(function(sd, i){
        if(((h >> i) & 1) === 0 && i % 4 === 3) return;
        var conv = p.phase >= 2 && ((h >> (i+2)) & 1) === 1;
        var st = conv ? (((h >> (i+5)) & 1) ? "progress" : "open") : "open";
        if(conv && p.phase >= 4 && i % 3 === 0) st = "closed";
        m.cards.push({id:"m"+(m.seq++), lane:sd[0], col:sd[1], title:sd[2], color:sd[3], desc:"", jproj:"CW", assignee: people[(h >> i) % 4], status:st, jira: conv ? "CW-"+(m.jseq++) : null});
      });
      var first = function(l){ return m.cards.filter(function(c){ return c.lane === l; })[0]; };
      var a = first(0), b = first(2), c2 = first(7), d = first(6);
      if(a && b) m.links.push({from:a.id, to:b.id});
      if(b && c2) m.links.push({from:b.id, to:c2.id});
      if(c2 && d) m.links.push({from:c2.id, to:d.id});

  }
  function muralSave(p){ try{ localStorage.setItem(muralKey(p.id), JSON.stringify(MU[p.id])); }catch(e){} }
  var muState = { sel:null, connecting:null, selLink:null };
  function muCard(p, id){ return muralOf(p).cards.filter(function(c){ return c.id === id; })[0]; }

  function muralHTML(p){

           '<p class="mu-hint">Drag a colour from the left into any cell. Click a sticky to open it: description, Jira project, assignee, status, and Convert to Jira. Drag stickies between cells. Double-click a team or a column to rename it.</p>';
  }
  function stkHTML(c){
    var jiraIcon = '<svg viewBox="0 0 16 16"><path d="M8 1l3.5 3.5L8 8 4.5 4.5 8 1zm0 4L11.5 8.5 8 12 4.5 8.5 8 5zm0 4l3.5 3.5L8 16l-3.5-3.5L8 9z"/></svg>';

             (c.assignee ? '<span class="who" title="'+esc(c.assignee)+'">'+esc(initials(c.assignee))+'</span>' : '')+
             (c.jira ? '<span class="key">'+jiraIcon+esc(c.jira)+'</span>' : '')+

  function stkEl(p, c){

  }
  function muRender(p){
    var m = muralOf(p), grid = $("muGrid"); if(!grid) return;
    var xIcon = '<svg viewBox="0 0 16 16"><path d="M12 3.3L11.3 2.6 8 5.9 4.7 2.6 4 3.3 7.3 6.6 4 9.9l.7.7L8 7.3l3.3 3.3.7-.7-3.3-3.3z"/></svg>';
    var plus = '<svg viewBox="0 0 16 16"><path d="M8.5 7.5V3h-1v4.5H3v1h4.5V13h1V8.5H13v-1H8.5z"/></svg>';
    grid.style.gridTemplateColumns = "150px repeat("+m.cols.length+", "+MU_COL_W+"px) 140px";
    var html = '<div class="mu-corner"><span class="lbl">Team / Column</span></div>';
    m.cols.forEach(function(name, ci){
      var n = m.cards.filter(function(c){ return c.col === ci; }).length;
      html += '<div class="mu-col" data-col="'+ci+'"><span class="nm" spellcheck="false">'+esc(name)+'</span><span class="cnt">'+n+'</span><button type="button" class="mu-x" data-delcol="'+ci+'" title="Remove column">'+xIcon+'</button></div>';
    });
    html += '<div class="mu-addcol"><button type="button" class="mu-addbtn" id="muAddCol">'+plus+'Column</button></div>';

      html += '<div class="mu-lane-lbl" data-lane="'+li+'" style="--lc:'+LANE_TINTS[li % LANE_TINTS.length]+'"><i class="bar"></i><b spellcheck="false">'+esc(name)+'</b><span class="cnt">'+n+' stickies</span><button type="button" class="mu-x" data-dellane="'+li+'" title="Remove team">'+xIcon+'</button></div>';
      m.cols.forEach(function(_, ci){ html += '<div class="cell" data-cell="'+li+':'+ci+'"></div>'; });

    m.cols.forEach(function(){ html += '<div></div>'; }); html += '<div></div>';
    html += '<svg class="mu-wires" id="muWires"><defs><marker id="muA" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M.5.5L7.5 4 .5 7.5z" fill="var(--dep)"/></marker></defs><g id="muLinkG"></g><path class="rb" id="muRubber" d="" style="display:none"></path></svg>';
    grid.innerHTML = html;
    m.cards.forEach(function(c){
      var cell = grid.querySelector('[data-cell="'+c.lane+':'+c.col+'"]');
      if(!cell){ c.lane = Math.min(c.lane, m.lanes.length-1); c.col = Math.min(c.col, m.cols.length-1); cell = grid.querySelector('[data-cell="'+c.lane+':'+c.col+'"]'); }

  function muStat(p){

  function muAnchor(id){
    var el = document.querySelector('.stk[data-mid="'+id+'"]'), grid = $("muGrid"); if(!el || !grid) return null;
    var r = el.getBoundingClientRect(), g = grid.getBoundingClientRect();
    var x = r.left - g.left, y = r.top - g.top;
    return { out:{x:x+r.width, y:y+r.height/2}, in:{x:x, y:y+r.height/2}, left:x, right:x+r.width, top:y, bottom:y+r.height };
  }
  function muPath(a, b){
    var cl = function(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); };
    var acx = (a.left + a.right)/2, acy = (a.top + a.bottom)/2, bcx = (b.left + b.right)/2, bcy = (b.top + b.bottom)/2;
    var sx, sy, tx, ty, k;
    if(b.left >= a.right - 4){                 // target to the right: right edge to left edge
      sx = a.right; sy = acy; tx = b.left; ty = bcy; k = cl((tx - sx) * 0.5, 6, 120);
      return "M"+sx+","+sy+" C"+(sx+k)+","+sy+" "+(tx-k)+","+ty+" "+tx+","+ty;
    }
    if(b.right <= a.left + 4){                 // target to the left: left edge to right edge
      sx = a.left; sy = acy; tx = b.right; ty = bcy; k = cl((sx - tx) * 0.5, 6, 120);
      return "M"+sx+","+sy+" C"+(sx-k)+","+sy+" "+(tx+k)+","+ty+" "+tx+","+ty;
    }
    if(b.top >= a.bottom - 4){                 // target below, overlapping: bottom edge to top edge
      sx = acx; sy = a.bottom; tx = bcx; ty = b.top; k = cl((ty - sy) * 0.5, 6, 100);
      return "M"+sx+","+sy+" C"+sx+","+(sy+k)+" "+tx+","+(ty-k)+" "+tx+","+ty;
    }
    if(b.bottom <= a.top + 4){                 // target above, overlapping: top edge to bottom edge
      sx = acx; sy = a.top; tx = bcx; ty = b.bottom; k = cl((sy - ty) * 0.5, 6, 100);
      return "M"+sx+","+sy+" C"+sx+","+(sy-k)+" "+tx+","+(ty+k)+" "+tx+","+ty;
    }
    // boxes overlap: short hook out the right side
    sx = a.right; sy = acy; tx = b.right; ty = bcy;
    return "M"+sx+","+sy+" C"+(sx+30)+","+sy+" "+(tx+30)+","+ty+" "+tx+","+ty;
  }
  function muDrawLinks(p){
    var m = muralOf(p), g = $("muLinkG"), grid = $("muGrid"), svg = $("muWires"); if(!g || !grid) return;
    svg.setAttribute("width", grid.scrollWidth); svg.setAttribute("height", grid.scrollHeight);

        x.innerHTML = '<svg viewBox="0 0 16 16"><path d="M12 3.3L11.3 2.6 8 5.9 4.7 2.6 4 3.3 7.3 6.6 4 9.9l.7.7L8 7.3l3.3 3.3.7-.7-3.3-3.3z"/></svg>';

  function muRemoveLink(p, i){

  /* drawer */
  function muDrawer(p){
    var d = $("muDrawer"); if(!d) return;
    var c = muState.sel ? muCard(p, muState.sel) : null;

  /* sticky: click opens, drag moves between cells, dot draws a dependency */
  function wireStk(p, el, id){
    var down = null, clone = null, moved = false;
    el.addEventListener("pointerdown", function(ev){
      if(ev.target.closest(".hd")){ ev.stopPropagation(); muState.connecting = id; document.body.style.cursor = "crosshair"; var rb = $("muRubber"); if(rb) rb.style.display = ""; return; }
      if(muState.connecting) return;
      down = {x:ev.clientX, y:ev.clientY}; moved = false;
      el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener("pointermove", function(ev){
      if(!down) return;
      var dx = ev.clientX - down.x, dy = ev.clientY - down.y;
      if(!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      if(!moved){
        moved = true; clone = el.cloneNode(true); clone.classList.add("mu-drag"); clone.classList.remove("sel");
        clone.style.width = el.offsetWidth+"px"; document.body.appendChild(clone); el.classList.add("ghosted");
      }
      clone.style.left = (ev.clientX - 60)+"px"; clone.style.top = (ev.clientY - 20)+"px";
      document.querySelectorAll(".cell.over").forEach(function(x){ x.classList.remove("over"); });
      var under = document.elementFromPoint(ev.clientX, ev.clientY), cell = under && under.closest ? under.closest(".cell:not(.spacer)") : null;
      if(cell) cell.classList.add("over");
    });
    function end(ev){
      if(!down) return;
      try{ el.releasePointerCapture(ev.pointerId); }catch(e){}
      var wasMove = moved; down = null; moved = false;
      if(clone){ clone.remove(); clone = null; }
      el.classList.remove("ghosted");
      document.querySelectorAll(".cell.over").forEach(function(x){ x.classList.remove("over"); });
      if(!wasMove) return;
      var under = document.elementFromPoint(ev.clientX, ev.clientY), cell = under && under.closest ? under.closest(".cell:not(.spacer)") : null;
      if(!cell) return;
      var m = muralOf(p), c = muCard(p, id), parts = cell.dataset.cell.split(":");
      var lane = parseInt(parts[0],10), col = parseInt(parts[1],10);
      var before = under.closest ? under.closest(".stk") : null;
      m.cards = m.cards.filter(function(x){ return x.id !== id; });
      c.lane = lane; c.col = col;
      var idx = before && before.dataset.mid !== id ? m.cards.findIndex(function(x){ return x.id === before.dataset.mid; }) : -1;
      if(idx === -1) m.cards.push(c); else m.cards.splice(idx, 0, c);
      muralSave(p); muRender(p); muDrawer(p);
    }
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
    el.addEventListener("click", function(ev){
      if(ev.target.closest(".hd")) return;
      if(muState.connecting){ muComplete(p, id); ev.stopPropagation(); return; }
      muSelect(p, muState.sel === id ? null : id);
    });
    el.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ muSelect(p, id); var t = $("dTitle"); if(t) t.focus(); }
      if(ev.key === "Delete" || ev.key === "Backspace"){ ev.preventDefault(); muDelete(p, id); }
    });
    el.addEventListener("pointerenter", function(){ if(muState.connecting && muState.connecting !== id) el.classList.add("target"); });
    el.addEventListener("pointerleave", function(){ el.classList.remove("target"); });
  }

  function wireMural(p){
    var mu = $("mu"); if(!mu) return;
    var cv = $("muCanvas");
    muRender(p); muDrawer(p);

    // palette drag into a cell
    var ghost = null, ghostColor = null;
    mu.querySelectorAll("[data-chip]").forEach(function(chip){
      chip.addEventListener("pointerdown", function(ev){
        ev.preventDefault(); ghostColor = this.dataset.chip;
        ghost = document.createElement("div"); ghost.className = "stk mu-drag c-"+ghostColor; ghost.innerHTML = '<div class="t">New sticky</div>';
        document.body.appendChild(ghost); moveGhost(ev);
        document.addEventListener("pointermove", moveGhost);
        document.addEventListener("pointerup", dropGhost, {once:true});
      });
    });
    function moveGhost(ev){
      if(!ghost) return;
      ghost.style.left = (ev.clientX-60)+"px"; ghost.style.top = (ev.clientY-20)+"px";
      document.querySelectorAll(".cell.over").forEach(function(x){ x.classList.remove("over"); });
      var under = document.elementFromPoint(ev.clientX, ev.clientY), cell = under && under.closest ? under.closest(".cell:not(.spacer)") : null;
      if(cell) cell.classList.add("over");
    }
    function dropGhost(ev){
      document.removeEventListener("pointermove", moveGhost);
      if(!ghost) return; ghost.remove(); ghost = null;
      document.querySelectorAll(".cell.over").forEach(function(x){ x.classList.remove("over"); });
      var under = document.elementFromPoint(ev.clientX, ev.clientY), cell = under && under.closest ? under.closest(".cell:not(.spacer)") : null;
      if(cell){ var parts = cell.dataset.cell.split(":"); muAdd(p, ghostColor, parseInt(parts[0],10), parseInt(parts[1],10)); }
      ghostColor = null;
    }

    mu.addEventListener("dblclick", function(ev){
      var col = ev.target.closest(".mu-col"), ln = ev.target.closest(".mu-lane-lbl");
      if(col){ muEditLabel(col.querySelector(".nm")); return; }
      if(ln){ muEditLabel(ln.querySelector("b")); return; }
      if(ev.target.closest(".stk")) return;
      var cell = ev.target.closest(".cell:not(.spacer)");
      if(cell){ var parts = cell.dataset.cell.split(":"); muAdd(p, "yellow", parseInt(parts[0],10), parseInt(parts[1],10)); }
    });
    mu.addEventListener("focusout", function(ev){
      var m = muralOf(p);
      if(ev.target.classList && ev.target.classList.contains("nm")){ ev.target.contentEditable = "false"; var ci = parseInt(ev.target.closest(".mu-col").dataset.col,10); m.cols[ci] = ev.target.textContent.trim() || "Column"; muralSave(p); muRender(p); }
      else if(ev.target.tagName === "B" && ev.target.closest(".mu-lane-lbl")){ ev.target.contentEditable = "false"; var li = parseInt(ev.target.closest(".mu-lane-lbl").dataset.lane,10); m.lanes[li] = ev.target.textContent.trim() || "Team"; muralSave(p); muRender(p); }
    });
    mu.addEventListener("keydown", function(ev){
      if(ev.key === "Enter" && ev.target.isContentEditable){ ev.preventDefault(); ev.target.blur(); }
    });
    mu.addEventListener("click", function(ev){
      var m = muralOf(p);
      if(ev.target.closest("#muAddCol")){ m.cols.push("Column "+(m.cols.length+1)); muralSave(p); muRender(p); cv.scrollLeft = cv.scrollWidth; var cols = $("muGrid").querySelectorAll(".mu-col .nm"); muEditLabel(cols[cols.length-1]); return; }
      if(ev.target.closest("#muAddLane")){ m.lanes.push("New team"); muralSave(p); muRender(p); cv.scrollTop = cv.scrollHeight; var ls = $("muGrid").querySelectorAll(".mu-lane-lbl b"); muEditLabel(ls[ls.length-1]); return; }
      var dc = ev.target.closest("[data-delcol]");
      if(dc){
        var ci = parseInt(dc.dataset.delcol,10);
        if(m.cols.length === 1){ toast("Keep at least one column"); return; }
        if(m.cards.some(function(c){ return c.col === ci; })){ toast("Move or delete the stickies in "+m.cols[ci]+" first"); return; }
        m.cols.splice(ci, 1); m.cards.forEach(function(c){ if(c.col > ci) c.col--; });
        muralSave(p); muRender(p); return;
      }
      var dl = ev.target.closest("[data-dellane]");
      if(dl){
        var li = parseInt(dl.dataset.dellane,10);
        if(m.lanes.length === 1){ toast("Keep at least one team"); return; }
        if(m.cards.some(function(c){ return c.lane === li; })){ toast("Move or delete the stickies in "+m.lanes[li]+" first"); return; }
        m.lanes.splice(li, 1); m.cards.forEach(function(c){ if(c.lane > li) c.lane--; });
        muralSave(p); muRender(p); return;
      }
    });
    cv.addEventListener("pointermove", function(ev){
      if(!muState.connecting) return;
      var a = muAnchor(muState.connecting), rb = $("muRubber"), grid = $("muGrid"); if(!a || !rb) return;
      var g = grid.getBoundingClientRect(), px = ev.clientX - g.left, py = ev.clientY - g.top, k = Math.max(40, Math.abs(px - a.out.x)*0.45);
      rb.setAttribute("d", "M"+a.out.x+","+a.out.y+" C"+(a.out.x+k)+","+a.out.y+" "+(px-k)+","+py+" "+px+","+py);
    });
    cv.addEventListener("pointerdown", function(ev){
      if(ev.target.closest(".stk") || ev.target.closest("button")) return;
      if(muState.connecting){ muCancelConnect(); return; }
      var lg = ev.target.closest ? ev.target.closest("g.lnk") : null;

    });

  }

  $("wsNext").addEventListener("click", function(){ stepProject(1); });
  window.addEventListener("popstate", function(){
    var m = location.hash.match(/^#p\/(CW-\d+)$/);
    if(m && proj(m[1])){ if(state.open !== m[1]) enterProject(m[1]); }
    else if(state.open){ exitProject(); }
  });
  window.addEventListener("resize", function(){ var p = proj(state.open); if(p && state.tab === "mural") muDrawLinks(p); });

  /* ---------- global keys + tools ---------- */
  document.addEventListener("keydown", function(ev){
    var typing = document.activeElement && (document.activeElement.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
    if((ev.key === "Delete" || ev.key === "Backspace") && !typing && state.open && state.tab === "mural" && muState.selLink != null){
      ev.preventDefault(); muRemoveLink(proj(state.open), muState.selLink); return;
    }
    if(ev.key === "Escape"){
      if(state.open && muState.selLink != null){ muState.selLink = null; muDrawLinks(proj(state.open)); }
      else if(state.open && muState.connecting){ muCancelConnect(); }
      else if(state.open){ exitProject(); }
      else if(!$("panel").hidden && $("saveBtn")){ select(state.sel, "read"); }
      else if(!$("panel").hidden){ closePanel(); }
      else if(anyFilter()){ clearAll(); }
    }
    if(ev.key === "/" && !state.open && document.activeElement !== $("search")){ ev.preventDefault(); $("search").focus(); }
    if(state.open && (ev.key === "[" || ev.key === "]")) stepProject(ev.key === "[" ? -1 : 1);
  });
  function clearAll(){
    state.rag = {}; state.q = {}; state.teams = {}; state.phases = {}; state.query = "";
    $("search").value = "";
    document.querySelectorAll(".bub").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
    apply();
  }
  $("search").addEventListener("input", function(){ state.query = this.value.trim(); apply(); });
  $("clearBtn").addEventListener("click", clearAll);
  document.querySelectorAll("#sortSeg [data-sort]").forEach(function(b){
    b.addEventListener("click", function(){ setSort(this.dataset.sort); });
  });
  function setSort(k){
    state.sort = k;
    document.querySelectorAll("#sortSeg [data-sort]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.sort === k ? "true" : "false"); });
    try{ localStorage.setItem("cwr.sort", k); }catch(e){}
    apply();
  }
  $("dComfy").addEventListener("click", function(){ setDensity("comfortable"); });
  $("dCompact").addEventListener("click", function(){ setDensity("compact"); });
  function setDensity(d){
    document.body.dataset.density = d;
    $("dComfy").setAttribute("aria-pressed", d === "comfortable" ? "true" : "false");
    $("dCompact").setAttribute("aria-pressed", d === "compact" ? "true" : "false");
    try{ localStorage.setItem("cwr.density", d); }catch(e){}
  }
  $("themeBtn").addEventListener("click", function(){
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("cwr.theme", next); }catch(e){}
    var p = proj(state.open); if(p && state.tab === "mural") muDrawLinks(p);
  });
  $("exportBtn").addEventListener("click", function(){
    var b = this, old = b.lastChild.nodeValue;
    b.lastChild.nodeValue = " Copied";
    setTimeout(function(){ b.lastChild.nodeValue = old; }, 1400);
  });

  /* ---------- boot ---------- */
  try{
    var d = localStorage.getItem("cwr.density");
    document.body.dataset.density = d || "comfortable";
    if(d === "compact"){ $("dCompact").setAttribute("aria-pressed","true"); $("dComfy").setAttribute("aria-pressed","false"); }
    var th = localStorage.getItem("cwr.theme");
    document.documentElement.setAttribute("data-theme", th === "dark" ? "dark" : "light");
  }catch(e){ document.body.dataset.density = "comfortable"; document.documentElement.setAttribute("data-theme", "light"); }

  try{ var so = localStorage.getItem("cwr.sort"); if(so === "phase" || so === "health") state.sort = so; }catch(e){}
  document.querySelectorAll("#sortSeg [data-sort]").forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.sort === state.sort ? "true" : "false"); });
  buildBubbles(); render(); apply();
  var m0 = location.hash.match(/^#p\/(CW-\d+)$/);
  if(m0 && proj(m0[1])) enterProject(m0[1]);
})();
</script>
